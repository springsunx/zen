<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#FFF">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
    <title>Shared Note - Zen</title>
    <script src="/assets/markdown-it.min.js"></script>
    <script src="/assets/plugin-container.js"></script>
    <script src="/assets/highlight.min.js"></script>
    <script src="/assets/plugin-alert.js"></script>
    <script src="/assets/plugin-align.js"></script>
    <script src="/assets/plugin-attrs.js"></script>
    <script src="/assets/plugin-dl.js"></script>
    <script src="/assets/plugin-footnote.js"></script>
    <script src="/assets/plugin-img-size.js"></script>
    <script src="/assets/plugin-img-lazyload.js"></script>
    <script src="/assets/plugin-ins.js"></script>
    <script src="/assets/plugin-mark.js"></script>
    <script src="/assets/plugin-sub.js"></script>
    <script src="/assets/plugin-sup.js"></script>
    <script src="/assets/plugin-emoji.js"></script>
    <script src="/assets/plugin-tasklist.js"></script>
    <script src="/assets/plugin-layout.js"></script>
    <script src="/assets/plugin-tab.js"></script>
    <link rel="stylesheet" href="/assets/reset.css">
    <link rel="stylesheet" href="/assets/github.min.css">
    <link rel="stylesheet" href="/assets/plugin-alert.css">
    <link rel="stylesheet" href="/assets/plugin-container.css">
    <link rel="stylesheet" href="/assets/plugin-tab.css">
    <style>
        :root {
            --neutral-0: #FFFFFF;
            --neutral-50: #FAFAFA;
            --neutral-100: #F5F5F5;
            --neutral-150: #EBEBEB;
            --neutral-200: #E5E5E5;
            --neutral-300: #D4D4D4;
            --neutral-400: #A3A3A3;
            --neutral-500: #737373;
            --neutral-600: #525252;
            --neutral-700: #404040;
            --neutral-800: #262626;
            --neutral-900: #171717;
            --text-primary: #171717;
            --primary-400: #60A5FA;
            --primary-500: #3B82F6;
            --primary-600: #2563EB;
            --primary-700: #1D4ED8;
            --red-500: #EF4444;
            --h2: 700 24px/1.3 system-ui,-apple-system,sans-serif;
            --h3: 700 20px/1.3 system-ui,-apple-system,sans-serif;
            --h5: 600 16px/1.4 system-ui,-apple-system,sans-serif;
            --h6: 600 14px/1.4 system-ui,-apple-system,sans-serif;
            --sm: 400 14px/1.5 system-ui,-apple-system,sans-serif;
            --xs: 400 12px/1.4 system-ui,-apple-system,sans-serif;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --neutral-0: #171717;
                --neutral-50: #1F1F1F;
                --neutral-100: #262626;
                --neutral-150: #2E2E2E;
                --neutral-200: #333333;
                --neutral-300: #404040;
                --neutral-400: #525252;
                --neutral-500: #737373;
                --neutral-600: #A3A3A3;
                --neutral-700: #D4D4D4;
                --neutral-800: #E5E5E5;
                --neutral-900: #F5F5F5;
                --text-primary: #F5F5F5;
                --primary-400: #60A5FA;
                --primary-500: #3B82F6;
                --primary-600: #2563EB;
                --primary-700: #BFDBFE;
            }
        }
        *, *::before, *::after { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            font-family: system-ui, -apple-system, sans-serif;
            color: var(--text-primary);
            background: var(--neutral-0);
        }
        body {
            overflow-x: hidden;
            overflow-y: auto;
        }
        .shared-note-wrapper {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .shared-note-container {
            flex: 1;
            max-width: 780px;
            width: 100%;
            margin: 0 auto;
            padding: 40px 32px;
        }
        .shared-note-header {
            margin-bottom: 32px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--neutral-200);
        }
        .shared-note-title {
            font: var(--h2);
            color: var(--text-primary);
            margin: 0 0 8px;
            word-wrap: break-word;
        }
        .shared-note-meta {
            font: var(--xs);
            color: var(--neutral-500);
        }
        .shared-note-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 12px;
        }
        .shared-note-tag {
            font: var(--xs);
            padding: 2px 8px;
            border-radius: 4px;
            color: #fff;
            font-size: 12px;
        }
        .shared-note-rendered {
            line-height: 1.7;
            color: var(--text-primary);
            word-wrap: break-word;
        }
        .shared-note-rendered strong { font-weight: 600; }
        .shared-note-rendered em { font-style: italic; }
        .shared-note-rendered h1 { font: var(--h2); margin: 24px 0 12px; }
        .shared-note-rendered h2 { font: var(--h3); margin: 20px 0 10px; }
        .shared-note-rendered h3 { font: var(--h5); margin: 16px 0 8px; }
        .shared-note-rendered h4, .shared-note-rendered h5, .shared-note-rendered h6 { font: var(--h6); margin: 14px 0 6px; }
        .shared-note-rendered p { margin: 0 0 12px; }
        .shared-note-rendered ul, .shared-note-rendered ol { margin: 0 0 12px; padding-left: 24px; }
        .shared-note-rendered li { margin-bottom: 4px; }
        .shared-note-rendered blockquote { margin: 0 0 12px; padding: 8px 16px; border-left: 3px solid var(--neutral-300); color: var(--neutral-600); }
        .shared-note-rendered img { max-width: 100%; border-radius: 8px; height: auto; }
        .shared-note-rendered table { border-collapse: collapse; width: 100%; margin: 0 0 12px; }
        .shared-note-rendered th, .shared-note-rendered td { border: 1px solid var(--neutral-200); padding: 8px 12px; text-align: left; }
        .shared-note-rendered th { background: var(--neutral-100); font-weight: 600; }
        .shared-note-rendered a { color: var(--primary-600); }
        .shared-note-rendered pre { margin: 0 0 12px; border-radius: 8px; overflow-x: auto; }
        .shared-note-rendered code { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; font-size: 0.9em; }
        .shared-note-rendered pre code { font-size: 13px; }

        /* Code block styles */
        .code-block-wrapper {
            margin: 0 0 12px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--neutral-200);
        }
        .code-block-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: var(--neutral-100);
            border-bottom: 1px solid var(--neutral-200);
            font-size: 12px;
            color: var(--neutral-500);
        }
        .code-block-lang {
            font: var(--xs);
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.5px;
        }
        .code-block-content {
            padding: 16px;
            overflow-x: auto;
            background: var(--neutral-50);
        }
        .code-block-content pre {
            margin: 0;
            border-radius: 0;
            background: transparent;
        }
        .code-block-content code { background: transparent; }

        /* Task list */
        .shared-note-rendered .task-list-item { list-style: none; margin-left: -24px; }
        .shared-note-rendered .task-list-item input[type="checkbox"] { margin-right: 8px; }

        /* Tabs */
        .tabs-tabs-wrapper { margin: 0 0 12px; }
        .tabs-tab-buttons { display: flex; gap: 2px; border-bottom: 1px solid var(--neutral-200); }
        .tabs-tab-button { padding: 8px 16px; cursor: pointer; font-size: 14px; border: none; background: none; color: var(--neutral-500); border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all 0.15s; }
        .tabs-tab-button:hover { color: var(--neutral-700); }
        .tabs-tab-button[data-active] { color: var(--primary-600); border-bottom-color: var(--primary-600); }
        .tabs-tab-content { display: none; padding: 16px 0; }
        .tabs-tab-content[data-active] { display: block; }

        .shared-note-error {
            text-align: center;
            padding: 80px 32px;
            color: var(--neutral-500);
        }
        .shared-note-expired {
            text-align: center;
            padding: 80px 32px;
        }
        .shared-note-expired h2 { font: var(--h3); color: var(--neutral-700); margin-bottom: 8px; }
        .shared-note-expired p { color: var(--neutral-500); }
        .powered-by {
            text-align: center;
            padding: 24px;
            color: var(--neutral-400);
            font: var(--xs);
        }
        .powered-by a { color: var(--neutral-500); text-decoration: none; }

        @media (max-width: 640px) {
            .shared-note-container { padding: 24px 16px; }
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <script>
    (function() {
        var token = window.location.pathname.replace(/^\/s\//, '').replace(/\/$/, '');
        var app = document.getElementById('app');

        function showError(msg) {
            app.innerHTML = '<div class="shared-note-error"><p>' + msg + '</p></div>';
        }

        function showExpired() {
            app.innerHTML = '<div class="shared-note-expired"><h2>Share Expired</h2><p>This shared note has expired or is no longer available.</p></div><div class="powered-by">Shared via <a href="/">Zen</a></div>';
        }

        function renderNote(note) {
            var md = window.markdownit({
                html: true,
                linkify: true,
                breaks: true,
                highlight: function(str, lang) {
                    if (lang && window.hljs && window.hljs.getLanguage(lang)) {
                        try { return window.hljs.highlight(str, { language: lang }).value; }
                        catch(e) {}
                    }
                    return '';
                }
            });

            var plugins = [
                { name: 'alert', fn: window.mdItPluginAlert && window.mdItPluginAlert.alert },
                { name: 'align', fn: window.mdItPluginAlign && window.mdItPluginAlign.align },
                { name: 'attrs', fn: window.mdItPluginAttrs && window.mdItPluginAttrs.attrs },
                { name: 'dl', fn: window.mdItPluginDl && window.mdItPluginDl.dl },
                { name: 'footnote', fn: window.mdItPluginFootnote && window.mdItPluginFootnote.footnote },
                { name: 'fullEmoji', fn: window.mdItPluginEmoji && window.mdItPluginEmoji.fullEmoji },
                { name: 'imgSize', fn: window.mdItPluginImgSize && window.mdItPluginImgSize.imgSize },
                { name: 'imgLazyload', fn: window.mdItPluginImgLazyload && window.mdItPluginImgLazyload.imgLazyload },
                { name: 'ins', fn: window.mdItPluginIns && window.mdItPluginIns.ins },
                { name: 'mark', fn: window.mdItPluginMark && window.mdItPluginMark.mark },
                { name: 'sub', fn: window.mdItPluginSub && window.mdItPluginSub.sub },
                { name: 'sup', fn: window.mdItPluginSup && window.mdItPluginSup.sup },
                { name: 'tasklist', fn: window.mdItPluginTasklist && window.mdItPluginTasklist.tasklist },
                { name: 'layout', fn: window.mdItPluginLayout && window.mdItPluginLayout.layout }
            ];

            plugins.forEach(function(p) {
                if (p.fn) {
                    try { md.use(p.fn); } catch(e) {}
                }
            });

            if (window.mdItPluginTab && window.mdItPluginTab.tab) {
                try { md.use(window.mdItPluginTab.tab, { name: 'tabs' }); } catch(e) {}
            }

            if (window.mdItPluginContainer && window.mdItPluginContainer.container) {
                var container = window.mdItPluginContainer.container;
                var types = ['note', 'tip', 'important', 'warning', 'caution'];
                var legacyMap = { info: 'note', success: 'important', danger: 'caution' };
                Object.keys(legacyMap).forEach(function(legacy) {
                    var target = legacyMap[legacy];
                    try {
                        md.use(container, legacy, {
                            validate: function(params) { return params.trim().toLowerCase().startsWith(legacy); },
                            render: function(tokens, idx) {
                                var token = tokens[idx];
                                var info = token.info.trim();
                                if (token.nesting === 1) {
                                    var title = info ? md.utils.escapeHtml(info) : legacy.toUpperCase();
                                    return '<div class="md-container md-container-' + target + '"><div class="md-container-title">' + title + '</div><div class="md-container-body">';
                                }
                                return '</div></div>';
                            }
                        });
                    } catch(e) {}
                });
                types.forEach(function(type) {
                    try {
                        md.use(container, type, {
                            validate: function(params) { return params.trim().toLowerCase().startsWith(type); },
                            render: function(tokens, idx) {
                                var token = tokens[idx];
                                var info = token.info.trim();
                                if (token.nesting === 1) {
                                    var title = info ? md.utils.escapeHtml(info) : type.toUpperCase();
                                    return '<div class="md-container md-container-' + type + '"><div class="md-container-title">' + title + '</div><div class="md-container-body">';
                                }
                                return '</div></div>';
                            }
                        });
                    } catch(e) {}
                });
                try {
                    md.use(container, 'details', {
                        render: function(tokens, idx) {
                            var token = tokens[idx];
                            var info = token.info.trim();
                            if (token.nesting === 1) {
                                var summary = info ? md.utils.escapeHtml(info) : 'Details';
                                return '<details class="md-container md-container-details"><summary>' + summary + '</summary><div class="md-container-body">';
                            }
                            return '</div></details>';
                        }
                    });
                } catch(e) {}
            }

            var fence = md.renderer.rules.fence || function(tokens, idx, options, env, self) {
                return self.renderToken(tokens, idx, options);
            };
            md.renderer.rules.fence = function(tokens, idx, options, env, self) {
                var token = tokens[idx];
                var lang = token.info ? token.info.trim() : '';
                var content = fence(tokens, idx, options, env, self);
                return '<div class="code-block-wrapper"><div class="code-block-header"><span class="code-block-lang">' + lang + '</span></div><div class="code-block-content">' + content + '</div></div>';
            };

            var rendered = md.render(note.content || '');

            var tagsHtml = '';
            if (note.tags && note.tags.length > 0) {
                tagsHtml = '<div class="shared-note-tags">' + note.tags.map(function(t) {
                    return '<span class="shared-note-tag" style="background-color:' + (t.color || '#888') + '">' + escapeHtml(t.name) + '</span>';
                }).join('') + '</div>';
            }

            var updatedStr = note.updatedAt ? new Date(note.updatedAt).toLocaleDateString() : '';

            app.innerHTML =
                '<div class="shared-note-wrapper">' +
                '<div class="shared-note-container">' +
                '<div class="shared-note-header">' +
                '<h1 class="shared-note-title">' + escapeHtml(note.title || 'Untitled') + '</h1>' +
                (updatedStr ? '<div class="shared-note-meta">Updated ' + updatedStr + '</div>' : '') +
                tagsHtml +
                '</div>' +
                '<div class="shared-note-rendered">' + rendered + '</div>' +
                '</div>' +
                '<div class="powered-by">Shared via <a href="/">Zen</a></div>' +
                '</div>';
        }

        function escapeHtml(text) {
            var d = document.createElement('div');
            d.textContent = text;
            return d.innerHTML;
        }

        fetch('/api/shares/' + token)
            .then(function(res) {
                if (res.status === 404) { showExpired(); return; }
                if (!res.ok) { showError('Failed to load note.'); return; }
                return res.json();
            })
            .then(function(note) {
                if (note) { renderNote(note); }
                else { showExpired(); }
            })
            .catch(function() {
                showError('Failed to load note. Please try again later.');
            });
    })();
    </script>
</body>
</html>
